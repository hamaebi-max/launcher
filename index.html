<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", sans-serif;
    background: #0F0F13;
    color: #F0EFF8;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 40px 24px;
    padding-top: calc(40px + env(safe-area-inset-top, 0px));
  }
  .icon {
    width: 100px;
    height: 100px;
    border-radius: 22px;
    overflow: hidden;
  }
  .icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
    text-align: center;
  }
  p {
    font-size: 14px;
    color: #9896B0;
    text-align: center;
    line-height: 1.7;
  }
  .btn {
    display: block;
    width: 100%;
    max-width: 320px;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: #6C63FF;
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: opacity .15s;
  }
  .btn:active { opacity: .75; }
</style>
